<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arella Praveen Kumar - Contact</title>
  <link rel="stylesheet" href="portfolio.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root{ --glass: rgba(255,255,255,0.08); --border: rgba(255,255,255,0.12); --accent: #00ffff; --gold:#FFD700; }
    body{ min-height:100vh; background: radial-gradient(1200px 800px at 10% 10%, rgba(0,255,255,0.12), transparent), radial-gradient(1200px 800px at 90% 20%, rgba(255,215,0,0.10), transparent), #0b0f1a; }
    .bg-anim{ position: fixed; inset: 0; background: conic-gradient(from 180deg at 50% 50%, rgba(0,255,255,.06), rgba(255,215,0,.06), rgba(0,255,255,.06)); filter: blur(80px); opacity:.7; z-index:0; animation: spin 30s linear infinite; }
    @keyframes spin{ to{ transform: rotate(1turn); } }

    .container{ position:relative; z-index:1; max-width: 1200px; margin: 0 auto; padding: 24px; }
    .glass{ background: var(--glass); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); backdrop-filter: blur(10px); }

    /* Nav */
    .nav-wrap{ display:flex; align-items:center; justify-content:space-between; padding: 12px 16px; margin-top: 24px; }
    .brand{ color:#fff; font-weight:700; letter-spacing:.5px; }
    .brand span{ color: var(--gold); }
    .menu-toggle{ width: 44px; height: 44px; display:flex; align-items:center; justify-content:center; border-radius:10px; border:1px solid var(--border); background:transparent; color:#fff; cursor:pointer; }
    #menu{ display:none; margin-top: 12px; padding: 12px; text-align:center; }
    #menu .nav{ display:inline-block; margin: 6px 10px; padding: 8px 12px; border-radius: 8px; color:#fff; text-decoration:none; border: 1px solid transparent; }
    #menu .nav:hover{ border-color: rgba(0,255,255,.35); color: var(--accent); background: rgba(0,255,255,.06); }

    /* Hero */
    .hero{ text-align:center; padding: 40px 24px; margin-top: 18px; }
    .hero h1{ color: var(--accent); font-size: 2.5rem; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; }
    .hero p{ color: #cfd8dc; font-size: 1.1rem; }

    /* Contact */
    .contact-container{ padding: 24px; margin-top: 18px; }
    .contact-details{ display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 30px; }
    .contact-item{ display: flex; align-items: center; gap: 12px; font-size: 1.1rem; color: #fff; }
    .contact-item i{ font-size: 1.5rem; color: var(--gold); transition: transform 0.3s ease; }
    .contact-item:hover i{ transform: scale(1.2); }
    .contact-item a{ color: var(--gold); text-decoration: none; transition: color 0.3s ease; }
    .contact-item a:hover{ color: var(--accent); }

    .contact-form{ max-width: 600px; margin: 0 auto; }
    .form-group{ margin-bottom: 20px; }
    .form-group label{ display: block; margin-bottom: 8px; color: #cfd8dc; font-weight: 600; }
    .form-group input, .form-group textarea{ 
        width: 100%; 
        padding: 12px; 
        border: 1px solid var(--border); 
        border-radius: 8px; 
        background: rgba(255,255,255,0.05); 
        color: #fff; 
        font-size: 1rem;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .form-group input:focus, .form-group textarea:focus{ 
        outline: none; 
        border-color: var(--accent); 
        box-shadow: 0 0 0 2px rgba(0,255,255,0.2); 
    }
    .form-group textarea{ min-height: 120px; resize: vertical; }
    .btn-submit{ 
        padding: 12px 24px; 
        border: none; 
        border-radius: 8px; 
        background: var(--gold); 
        color: #121212; 
        font-weight: 600; 
        cursor: pointer; 
        transition: background 0.3s ease, transform 0.3s ease; 
        font-size: 1rem;
    }
    .btn-submit:hover{ 
        background: #FFC107; 
        transform: scale(1.05); 
    }

    /* Responsive */
    @media (max-width: 768px){
        .contact-details{ gap: 15px; }
        .contact-item{ font-size: 1rem; }
        .hero h1{ font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="bg-anim"></div>
  <div class="container">
    <div class="glass nav-wrap">
      <div class="brand">Arella <span>Praveen</span> Kumar</div>
      <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </div>
    <div id="menu" class="glass">
      <a href="index.html" target="_self" class="nav" id="index">About</a>
      <a href="Toolset.html" class="nav" id="Toolset">Toolset</a>
      <a href="project.html" class="nav" id="project">Projects</a>
      <a href="contact.html" class="nav" id="contact">Contact</a>
    </div>

    <div class="glass hero">
      <h1>Contact Me</h1>
      <p>Let's connect and discuss your next project</p>
    </div>

    <div class="glass contact-container">
      <div class="contact-details">
        <div class="contact-item">
          <i class="fas fa-envelope"></i>
          <a href="mailto:arellapraveen4@gmail.com" target="_blank">arellapraveen4@gmail.com</a>
        </div>
        <div class="contact-item">
          <i class="fas fa-phone"></i>
          <span>+91-7729067783</span>
        </div>
        <div class="contact-item">
          <i class="fab fa-linkedin"></i>
          <a href="https://www.linkedin.com/in/praveen-kumar-arella-059a75303/" target="_blank">LinkedIn</a>
        </div>
        <div class="contact-item">
          <i class="fab fa-github"></i>
          <a href="https://github.com/arellapraveen4" target="_blank">GitHub</a>
        </div>
        <div class="contact-item">
          <i class="fas fa-map-marker-alt"></i>
          <span>Hyderabad, India</span>
        </div>
      </div>
      
      <div class="contact-form">
        <form action="#" method="post">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button type="submit" class="btn-submit">Send Message</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function toggleMenu() {
      let menu = document.getElementById("menu");
      if (menu.classList.contains('show')) {
          menu.classList.remove('show');
          menu.classList.add('hide');
          menu.style.display = 'none';
      } else {
          menu.classList.remove('hide');
          menu.classList.add('show');
          menu.style.display = 'block';
      }
    }
    let currentPage = window.location.pathname.split("/").pop();
    currentPage = currentPage.replace(".html", "");
    if (currentPage) {
      const nav = document.getElementById(currentPage);
      if(nav){ nav.style.textDecoration = "underline"; nav.style.color = "aqua"; }
    }
  </script>
</body>
</html>
